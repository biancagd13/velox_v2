<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica y adaptación responsiva para dispositivos móviles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título dinámico mediante Jinja2 según el contexto (Alta o Edición) -->
    <title>{{ "Editar Reserva" if reserva else "Nueva Reserva" }} - Velox UTVT</title>
    
    <!-- Librerías base: Bootstrap 5, Iconos y SweetAlert2 para modales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Fondo blanco unificado para la interfaz */
        body { background-color: #FFFFFF !important; }
        
        /* Ajuste del contenedor principal para dar espacio al menú lateral en escritorio */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        
        /* Estilos del botón principal institucional (Verde Velox) */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }
        .boton-verde:hover { background-color: #005200 !important; }
        
        /* Estilos específicos para los botones de confirmación de SweetAlert2 */
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover { background-color: #005200 !important; }
        
        /* --- MODO RESPONSIVO PARA DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            /* Eliminamos el margen del menú en pantallas pequeñas */
            #contenidoPrincipal {
                margin-left: 0 !important;
            }
            /* Apilamos los botones de acción para que ocupen todo el ancho y no se encimen */
            .grupo-botones {
                flex-direction: column;
                gap: 10px !important;
                width: 100%;
            }
            .grupo-botones a, .grupo-botones button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Inserción dinámica del menú lateral (Sidebar) -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor general centrado vertical y horizontalmente -->
    <div id="contenidoPrincipal" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        
        <!-- Contenedor que limita el ancho del formulario para que no se deforme en PC -->
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <!-- Encabezado del Formulario -->
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-calendar-check-fill me-2"></i>{{ "Editar Reserva #" ~ reserva.id_reserva if reserva else "Registrar Nueva Reserva" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <!-- Formulario Dinámico (Apunta a guardar o actualizar dependiendo si 'reserva' existe) -->
                <form id="formularioReserva" action="{{ '/reserva/actualizar' if reserva else '/reserva/guardar' }}" method="POST">
                    
                    <!-- Campo oculto y visualización de ID: Solo se muestra en modo Edición -->
                    {% if reserva %}
                    <input type="hidden" name="id_reserva" value="{{ reserva.id_reserva }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ reserva.id_reserva }}" readonly>
                    </div>
                    {% endif %}

                    <!-- Campo Selector de Estado -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Estado de la Reserva</label>
                        <select id="estadoReserva" name="estado" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un estado...</option>
                            <option value="PENDIENTE" {% if reserva and reserva.get('estado') == 'PENDIENTE' %}selected{% endif %}>PENDIENTE</option>
                            <option value="CONFIRMADA" {% if reserva and reserva.get('estado') == 'CONFIRMADA' %}selected{% endif %}>CONFIRMADA</option>
                            <option value="CANCELADA" {% if reserva and reserva.get('estado') == 'CANCELADA' %}selected{% endif %}>CANCELADA</option>
                        </select>
                    </div>

                    <!-- Campo Selector del Usuario/Pasajero -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Pasajero (Usuario)</label>
                        <select id="idUsuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un usuario...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if reserva and reserva.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Campo Selector del Viaje -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Viaje Seleccionado</label>
                        <select id="idViaje" name="id_viaje" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un viaje...</option>
                            {% for viaje in viajes %}
                            <option value="{{ viaje.id_viaje }}" {% if reserva and reserva.id_viaje == viaje.id_viaje %}selected{% endif %}>
                                Viaje #{{ viaje.id_viaje }} ({{ viaje.origen }} ➔ {{ viaje.destino }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Grupo de Botones de Acción (Responsivo) -->
                    <div class="grupo-botones d-flex justify-content-end gap-2">
                        <a href="/reserva" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn boton-verde px-5 fw-bold shadow-sm rounded-pill">
                            {{ "Guardar Cambios" if reserva else "Registrar Reserva" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Oficial de Bootstrap para componentes de interfaz -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Función principal para validar el formulario y mostrar las alertas interactivas
        function confirmarGuardado() {
            // Capturamos los valores de los selects
            const estado = document.getElementById('estadoReserva').value;
            const usuario = document.getElementById('idUsuario').value;
            const viaje = document.getElementById('idViaje').value;
            
            // Si algún campo obligatorio está vacío, se dispara la validación visual nativa del navegador
            if(!estado || !usuario || !viaje) {
                document.getElementById('formularioReserva').reportValidity();
                return;
            }

            // Mostramos la ventana de advertencia pidiendo confirmación
            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultadoConfirmacion) => {
                // Si el usuario presiona "Sí, guardar"
                if (resultadoConfirmacion.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        // Enviamos los datos del formulario al backend mediante método POST
                        document.getElementById('formularioReserva').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
