<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Reserva" if reserva else "Nueva Reserva" }} - Velox UTVT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #FFFFFF !important;
        }
        #mainContent {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        .btn-verde-custom {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .btn-verde-custom:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
        }
        @media (max-width: 768px) {
            #mainContent {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>

    {% include 'components/sidebar.html' %}

    <div id="mainContent" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-calendar-check-fill me-2" style="color: #005200;"></i>{{ "Editar Reserva #" ~ reserva.id_reserva if reserva else "Registrar Nueva Reserva" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <form id="formularioReserva" action="{{ '/reserva/actualizar' if reserva else '/reserva/guardar' }}" method="POST">
                    
                    {% if reserva %}
                    <input type="hidden" name="id_reserva" value="{{ reserva.id_reserva }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ reserva.id_reserva }}" readonly>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Estado de la Reserva</label>
                        <select id="estado" name="estado" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un estado...</option>
                            <option value="PENDIENTE" {% if reserva and reserva.get('estado') == 'PENDIENTE' %}selected{% endif %}>PENDIENTE</option>
                            <option value="CONFIRMADA" {% if reserva and reserva.get('estado') == 'CONFIRMADA' %}selected{% endif %}>CONFIRMADA</option>
                            <option value="CANCELADA" {% if reserva and reserva.get('estado') == 'CANCELADA' %}selected{% endif %}>CANCELADA</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Pasajero (Usuario)</label>
                        <select id="id_usuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un usuario...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if reserva and reserva.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Viaje Seleccionado</label>
                        <select id="id_viaje" name="id_viaje" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un viaje...</option>
                            {% for viaje in viajes %}
                            <option value="{{ viaje.id_viaje }}" {% if reserva and reserva.id_viaje == viaje.id_viaje %}selected{% endif %}>
                                Viaje #{{ viaje.id_viaje }} ({{ viaje.origen }} ➔ {{ viaje.destino }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/reserva" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn px-5 fw-bold shadow-sm rounded-pill btn-verde-custom">
                            {{ "Guardar Cambios" if reserva else "Registrar Reserva" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmarGuardado() {
            const estado = document.getElementById('estado').value;
            const idUsuario = document.getElementById('id_usuario').value;
            const idViaje = document.getElementById('id_viaje').value;
            
            if(!estado || !idUsuario || !idViaje) {
                document.getElementById('formularioReserva').reportValidity();
                return;
            }

            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultado_confirmacion) => {
                if (resultado_confirmacion.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        document.getElementById('formularioReserva').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
