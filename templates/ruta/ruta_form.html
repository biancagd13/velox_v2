<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Declaración de formato y diseño responsivo para móviles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Ruta" if ruta else "Nueva Ruta" }} - Velox UTVT</title>
    
    <!-- Archivos CSS y utilidades base (Bootstrap y SweetAlert2) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Fondo blanco para diseño institucional */
        body { background-color: #FFFFFF !important; }
        
        /* Ajuste del contenido general para que no se encime al menú lateral */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        
        /* Estilos del botón principal verde (color Velox) */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .boton-verde:hover { background-color: #005200 !important; color: #ffffff !important; }
        
        /* Diseño unificado para los botones de las alertas modales */
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover { background-color: #005200 !important; }
        
        /* --- DISEÑO RESPONSIVO PARA DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            /* Eliminamos el margen del menú en pantallas pequeñas */
            #contenidoPrincipal {
                margin-left: 0 !important;
            }
            /* Apilamos los botones de acción para que no se deformen y sean fáciles de tocar */
            .grupo-botones {
                flex-direction: column;
                gap: 10px !important;
                width: 100%;
            }
            .grupo-botones a, .grupo-botones button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Integración del Menú Lateral (Sidebar) mediante Jinja2 -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor general centrado en la pantalla -->
    <div id="contenidoPrincipal" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        
        <!-- Restricción de ancho para mantener el formato en PC -->
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <!-- Encabezado del Formulario -->
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-geo-alt-fill me-2"></i>{{ "Editar Ruta #" ~ ruta.id_ruta if ruta else "Registrar Nueva Ruta" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <!-- Formulario dinámico: Selecciona la ruta de guardado o actualización según el contexto -->
                <form id="formularioRuta" action="{{ '/ruta/actualizar' if ruta else '/ruta/guardar' }}" method="POST">
                    
                    <!-- Campo oculto y solo lectura del ID (Visible solo en Edición) -->
                    {% if ruta %}
                    <input type="hidden" name="id_ruta" value="{{ ruta.id_ruta }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ ruta.id_ruta }}" readonly>
                    </div>
                    {% endif %}

                    <!-- Campo de texto para Origen -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Lugar de Origen</label>
                        <input type="text" id="origenRuta" name="origen" class="form-control py-2" value="{{ ruta.origen if ruta else '' }}" placeholder="Ej. Toluca Centro" required>
                    </div>

                    <!-- Campo de texto para Destino -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Lugar de Destino</label>
                        <input type="text" id="destinoRuta" name="destino" class="form-control py-2" value="{{ ruta.destino if ruta else '' }}" placeholder="Ej. UTVT Almoloya de Juárez" required>
                    </div>

                    <!-- Input de tipo Hora -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Hora de Salida</label>
                        <input type="time" id="horaSalida" name="hora_salida" class="form-control py-2" value="{{ ruta.hora_salida if ruta else '' }}" required>
                    </div>

                    <!-- Lista desplegable para seleccionar al usuario creador -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Usuario Creador</label>
                        <select id="idUsuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un usuario...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if ruta and ruta.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Grupo de botones (Responsivos en celular) -->
                    <div class="grupo-botones d-flex justify-content-end gap-2">
                        <a href="/ruta" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn boton-verde px-5 fw-bold shadow-sm rounded-pill">
                            {{ "Guardar Cambios" if ruta else "Registrar Ruta" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        /**
         * Función JS para validar los datos e invocar las alertas modales interactivas (SweetAlert2).
         */
        function confirmarGuardado() {
            // Extracción de datos del formulario eliminando espacios extra
            const origen = document.getElementById('origenRuta').value.trim();
            const destino = document.getElementById('destinoRuta').value.trim();
            const hora = document.getElementById('horaSalida').value.trim();
            const usuario = document.getElementById('idUsuario').value;
            
            // Validación nativa si faltan campos
            if(!origen || !destino || !hora || !usuario) {
                document.getElementById('formularioRuta').reportValidity();
                return;
            }

            // Primera Modal: Confirmación de guardado
            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultadoConfirmacion) => {
                if (resultadoConfirmacion.isConfirmed) {
                    
                    // Segunda Modal: Mensaje temporal de éxito
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        // Invocación del evento POST hacia el backend
                        document.getElementById('formularioRuta').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
