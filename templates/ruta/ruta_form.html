<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Ruta" if ruta else "Nueva Ruta" }} - Velox UTVT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #FFFFFF !important;
        }
        #mainContent {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        .btn-verde-custom {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .btn-verde-custom:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
        }
        @media (max-width: 768px) {
            #mainContent {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>

    {% include 'components/sidebar.html' %}

    <div id="mainContent" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-geo-alt-fill me-2" style="color: #005200;"></i>{{ "Editar Ruta #" ~ ruta.id_ruta if ruta else "Registrar Nueva Ruta" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <form id="formularioRuta" action="{{ '/ruta/actualizar' if ruta else '/ruta/guardar' }}" method="POST">
                    
                    {% if ruta %}
                    <input type="hidden" name="id_ruta" value="{{ ruta.id_ruta }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ ruta.id_ruta }}" readonly>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Lugar de Origen</label>
                        <input type="text" id="origen" name="origen" class="form-control py-2" value="{{ ruta.origen if ruta else '' }}" placeholder="Ej. Toluca Centro" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Lugar de Destino</label>
                        <input type="text" id="destino" name="destino" class="form-control py-2" value="{{ ruta.destino if ruta else '' }}" placeholder="Ej. UTVT Almoloya de Juárez" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Hora de Salida</label>
                        <input type="time" id="hora_salida" name="hora_salida" class="form-control py-2" value="{{ ruta.hora_salida if ruta else '' }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Usuario Creador</label>
                        <select id="id_usuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un usuario...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if ruta and ruta.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/ruta" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn px-5 fw-bold shadow-sm rounded-pill btn-verde-custom">
                            {{ "Guardar Cambios" if ruta else "Registrar Ruta" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmarGuardado() {
            const origen = document.getElementById('origen').value;
            const destino = document.getElementById('destino').value;
            const horaSalida = document.getElementById('hora_salida').value;
            const idUsuario = document.getElementById('id_usuario').value;
            
            if(!origen.trim() || !destino.trim() || !horaSalida.trim() || !idUsuario) {
                document.getElementById('formularioRuta').reportValidity();
                return;
            }

            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultado_confirmacion) => {
                if (resultado_confirmacion.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        document.getElementById('formularioRuta').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
