<script>
    /* Script JavaScript encargado de controlar la apertura, cierre y ajuste responsivo de márgenes del menú lateral */
    document.addEventListener('DOMContentLoaded', () => {
        const botonAlternar = document.getElementById('botonAlternarMenu');
        const botonAbrir = document.getElementById('btnOpenSidebar');
        const menuLateral = document.getElementById('sidebar');
        const contenidoPrincipal = document.getElementById('mainContent');

        /**
         * Función lógica para alternar el estado visual del menú lateral (colapsar o expandir).
         */
        function alternarMenuLateral() {
            menuLateral.classList.toggle('menu-oculto');
            const estaOculto = menuLateral.classList.contains('menu-oculto');
            
            if (estaOculto) {
                if (botonAbrir) botonAbrir.style.display = 'inline-block';
                if (contenidoPrincipal) contenidoPrincipal.style.marginLeft = '0';
            } else {
                if (botonAbrir) botonAbrir.style.display = 'none';
                if (contenidoPrincipal) contenidoPrincipal.style.marginLeft = '280px';
            }
        }

        /* Asignación de eventos de escucha (click) para los botones de control de apertura y cierre del menú */
        if (botonAlternar) botonAlternar.addEventListener('click', alternarMenuLateral);
        if (botonAbrir) botonAbrir.addEventListener('click', alternarMenuLateral);
    });
</script>
