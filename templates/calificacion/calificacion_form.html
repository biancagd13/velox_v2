<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración del documento y diseño responsivo -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Calificación" if calificacion else "Nueva Calificación" }} - Velox UTVT</title>

    <!-- Librerías base (Bootstrap 5, Iconos y SweetAlert2) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Fondo principal de la vista */
        body { background-color: #FFFFFF !important; }

        /* Ajuste del contenedor para no chocar con el menú lateral en PC */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }

        /* Estilo institucional para los botones primarios (Verde Velox) */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }
        .boton-verde:hover { 
            background-color: #005200 !important; 
        }

        /* Estilo para los botones de confirmación en las modales de SweetAlert */
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
        }

        /* Adaptación a dispositivos móviles (quitar margen del menú) */
        @media (max-width: 768px) {
            #contenidoPrincipal {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Menú lateral institucional de la aplicación -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor centrado para el formulario -->
    <div id="contenidoPrincipal" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        <div class="container px-3" style="max-width: 600px;">
            
            <!-- Tarjeta principal del formulario -->
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <!-- Cabecera del formulario -->
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-star-fill me-2"></i>{{ "Editar Calificación #" ~ calificacion.id_calificacion if calificacion else "Registrar Nueva Calificación" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <!-- Formulario dinámico (Guardar o Actualizar según contexto) -->
                <form id="formularioCalificacion" action="{{ '/calificacion/actualizar' if calificacion else '/calificacion/guardar' }}" method="POST">
                    
                    <!-- Campo oculto y visible solo si se está editando un registro existente -->
                    {% if calificacion %}
                    <input type="hidden" name="id_calificacion" value="{{ calificacion.id_calificacion }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ calificacion.id_calificacion }}" readonly>
                    </div>
                    {% endif %}

                    <!-- Campo de Puntuación (1-5) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Puntuación (1 al 5)</label>
                        <input type="number" id="puntuacion" name="puntuacion" min="1" max="5" class="form-control py-2" value="{{ calificacion.puntuacion if calificacion else '' }}" placeholder="Ej. 5" required>
                    </div>

                    <!-- Campo de Comentario -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Comentario / Reseña</label>
                        <textarea id="comentario" name="comentario" class="form-control py-2" rows="3" placeholder="Ej. Excelente servicio y puntualidad..." required>{{ calificacion.comentario if calificacion else '' }}</textarea>
                    </div>

                    <!-- Lista desplegable para seleccionar el Usuario -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Usuario Emisor</label>
                        <select id="id_usuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un usuario...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if calificacion and calificacion.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Lista desplegable para seleccionar el Viaje -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Viaje Calificado</label>
                        <select id="id_viaje" name="id_viaje" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un viaje...</option>
                            {% for viaje in viajes %}
                            <option value="{{ viaje.id_viaje }}" {% if calificacion and calificacion.id_viaje == viaje.id_viaje %}selected{% endif %}>
                                Viaje #{{ viaje.id_viaje }} ({{ viaje.origen }} ➔ {{ viaje.destino }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Botones de acción del formulario -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/calificacion" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn boton-verde px-5 fw-bold shadow-sm rounded-pill">
                            {{ "Guardar Cambios" if calificacion else "Registrar Calificación" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script de componentes interactivos de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Función principal que valida el formulario y muestra modales de confirmación
        function confirmarGuardado() {
            // Captura los valores de los inputs obligatorios
            const puntuacion = document.getElementById('puntuacion').value.trim();
            const comentario = document.getElementById('comentario').value.trim();
            const idUsuario = document.getElementById('id_usuario').value;
            const idViaje = document.getElementById('id_viaje').value;
            
            // Si falta algún dato, activa la validación nativa del navegador
            if(!puntuacion || !comentario || !idUsuario || !idViaje) {
                document.getElementById('formularioCalificacion').reportValidity();
                return;
            }

            // Muestra la ventana modal de confirmación
            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultado) => {
                // Si el usuario acepta, muestra la modal de éxito y envía el formulario
                if (resultado.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        document.getElementById('formularioCalificacion').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
