<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Declaración de formato de caracteres y diseño responsivo -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Viaje" if viaje else "Nuevo Viaje" }} - Velox UTVT</title>

    <!-- Enlaces a librerías base (Bootstrap 5, Iconos y SweetAlert2) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Fondo blanco puro para mantener un diseño unificado y limpio */
        body { background-color: #FFFFFF !important; }

        /* Ajuste del contenedor principal para dar espacio al menú lateral en escritorio */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }

        /* Estilos del botón institucional principal (Verde Velox) */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .boton-verde:hover { background-color: #005200 !important; color: #ffffff !important; }

        /* Estilos unificados para los botones de las alertas modales */
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover { background-color: #005200 !important; }

        /* --- MODO RESPONSIVO PARA DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            /* Eliminamos el margen del menú en pantallas pequeñas */
            #contenidoPrincipal {
                margin-left: 0 !important;
                padding: 15px !important;
            }
            /* Apilamos los botones del formulario para mejor usabilidad táctil */
            .grupo-botones {
                flex-direction: column;
                gap: 10px !important;
                width: 100%;
            }
            .grupo-botones a, .grupo-botones button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Inserción dinámica del Menú Lateral (Sidebar) mediante Jinja2 -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor general centrado en la pantalla -->
    <div id="contenidoPrincipal" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">

        <!-- Contenedor que restringe el ancho del formulario en escritorio -->
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">

                <!-- Encabezado del Formulario -->
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-signpost-split-fill me-2"></i>{{ "Editar Viaje #" ~ viaje.id_viaje if viaje else "Registrar Nuevo Viaje" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <!-- Formulario dinámico: Selecciona la ruta de guardado o actualización según el contexto -->
                <form id="formularioViaje" action="{{ '/viaje/actualizar' if viaje else '/viaje/guardar' }}" method="POST">

                    <!-- Campo oculto y vista de solo lectura del ID (Aparece solo en Edición) -->
                    {% if viaje %}
                    <input type="hidden" name="id_viaje" value="{{ viaje.id_viaje }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ viaje.id_viaje }}" readonly>
                    </div>
                    {% endif %}

                    <!-- Campos ocultos automáticos: estado inicial 'pendiente' y conductor autenticado -->
                    <input type="hidden" id="estadoViaje" name="estado" value="{{ viaje.estado if viaje else 'pendiente' }}">
                    <input type="hidden" id="usuarioConductor" name="id_usuario" value="{{ viaje.id_usuario if viaje else (id_conductor_actual | default(1)) }}">

                    <!-- Campo para capturar la fecha programada del viaje -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Fecha del Viaje</label>
                        <input type="date" id="fechaViaje" name="fecha" class="form-control py-2" value="{{ viaje.fecha if viaje else '' }}" required>
                    </div>

                    <!-- Campo numérico para la disponibilidad de lugares (Máximo 10) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Asientos Disponibles</label>
                        <input type="number" id="asientosDisponibles" name="asientos_disponibles" min="1" max="10" class="form-control py-2" value="{{ viaje.asientos_disponibles if viaje else '' }}" placeholder="Ej. 4" required>
                    </div>

                    <!-- Campo numérico para la tarifa o cuota -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Costo ($ MXN)</label>
                        <input type="number" id="costoViaje" name="costo" min="0" class="form-control py-2" value="{{ viaje.costo if viaje else '' }}" placeholder="Ej. 50" required>
                    </div>

                    <!-- Lista desplegable conectada a la base de datos para asignar la ruta -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Ruta del Viaje</label>
                        <select id="rutaAsignada" name="id_ruta" class="form-select py-2" required>
                            <option value="" disabled {% if not viaje %}selected{% endif %}>Selecciona una ruta...</option>
                            {% for ruta in rutas %}
                            <option value="{{ ruta.id_ruta }}" {% if viaje and viaje.id_ruta == ruta.id_ruta %}selected{% endif %}>
                                Ruta #{{ ruta.id_ruta }} ({{ ruta.origen }} ➔ {{ ruta.destino }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Contenedor responsivo de botones (Cancelar y Submit) -->
                    <div class="grupo-botones d-flex justify-content-end gap-2">
                        <a href="/viaje" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn boton-verde px-5 fw-bold shadow-sm rounded-pill">
                            {{ "Guardar Cambios" if viaje else "Registrar Viaje" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Oficial de Bootstrap para el manejo de interfaz -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Sincronizamos el ID del conductor autenticado desde localStorage al crear un nuevo viaje
        document.addEventListener('DOMContentLoaded', function () {
            const esEdicion = {{ 'true' if viaje else 'false' }};
            if (!esEdicion) {
                const idSesion = parseInt(localStorage.getItem('velox_usuario_id'), 10);
                if (!Number.isNaN(idSesion) && idSesion > 0) {
                    document.getElementById('usuarioConductor').value = idSesion;
                }
            }
        });

        /**
         * Función JS para validar los campos visibles e invocar las alertas modales interactivas (SweetAlert2).
         */
        function confirmarGuardado() {
            // Extracción de datos visibles del formulario eliminando espacios extra
            const fecha = document.getElementById('fechaViaje').value.trim();
            const asientos = document.getElementById('asientosDisponibles').value.trim();
            const costo = document.getElementById('costoViaje').value.trim();
            const idRuta = document.getElementById('rutaAsignada').value;

            // Validación nativa obligatoria del navegador sobre los campos visibles
            if (!fecha || !asientos || !costo || !idRuta) {
                document.getElementById('formularioViaje').reportValidity();
                return;
            }

            // Primera Modal: Confirmación antes de mandar datos al servidor
            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultadoConfirmacion) => {
                if (resultadoConfirmacion.isConfirmed) {

                    // Segunda Modal: Mensaje de éxito temporal
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        // Envío POST del formulario a FastAPI (incluye estado y id_usuario ocultos)
                        document.getElementById('formularioViaje').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
