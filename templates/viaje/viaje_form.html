<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Viaje" if viaje else "Nuevo Viaje" }} - Velox UTVT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #FFFFFF !important;
        }
        #mainContent {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        .btn-verde-custom {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .btn-verde-custom:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
        }
        @media (max-width: 768px) {
            #mainContent {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>

    {% include 'components/sidebar.html' %}

    <div id="mainContent" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi-signpost-split-fill" style="color: #005200;"></i>{{ "Editar Viaje #" ~ viaje.id_viaje if viaje else "Registrar Nuevo Viaje" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario institucional.</p>
                    </div>
                </div>

                <form id="formularioViaje" action="{{ '/viaje/actualizar' if viaje else '/viaje/guardar' }}" method="POST">
                    
                    {% if viaje %}
                    <input type="hidden" name="id_viaje" value="{{ viaje.id_viaje }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ viaje.id_viaje }}" readonly>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Fecha del Viaje</label>
                        <input type="date" id="fecha" name="fecha" class="form-control py-2" value="{{ viaje.fecha if viaje else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Asientos Disponibles</label>
                        <input type="number" id="asientos_disponibles" name="asientos_disponibles" min="1" max="10" class="form-control py-2" value="{{ viaje.asientos_disponibles if viaje else '' }}" placeholder="Ej. 4" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Costo ($ MXN)</label>
                        <input type="number" id="costo" name="costo" min="0" class="form-control py-2" value="{{ viaje.costo if viaje else '' }}" placeholder="Ej. 50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Estado del Viaje</label>
                        <select id="estado" name="estado" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un estado...</option>
                            <option value="pendiente" {% if viaje and (viaje.estado == 'pendiente' or viaje.get('estado') == 'pendiente') %}selected{% endif %}>PENDIENTE</option>
                            <option value="aceptado" {% if viaje and (viaje.estado == 'aceptado' or viaje.get('estado') == 'aceptado') %}selected{% endif %}>ACEPTADO</option>
                            <option value="cancelado" {% if viaje and (viaje.estado == 'cancelado' or viaje.get('estado') == 'cancelado') %}selected{% endif %}>CANCELADO</option>
                            <option value="finalizado" {% if viaje and (viaje.estado == 'finalizado' or viaje.get('estado') == 'finalizado') %}selected{% endif %}>FINALIZADO</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Ruta del Viaje</label>
                        <select id="id_ruta" name="id_ruta" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona una ruta...</option>
                            {% for ruta in rutas %}
                            <option value="{{ ruta.id_ruta }}" {% if viaje and viaje.id_ruta == ruta.id_ruta %}selected{% endif %}>
                                Ruta #{{ ruta.id_ruta }} ({{ ruta.origen }} ➔ {{ ruta.destino }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Conductor (Usuario)</label>
                        <select id="id_usuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un conductor...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if viaje and viaje.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/viaje" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn px-5 fw-bold shadow-sm rounded-pill btn-verde-custom">
                            {{ "Guardar Cambios" if viaje else "Registrar Viaje" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmarGuardado() {
            const fecha = document.getElementById('fecha').value;
            const asientos = document.getElementById('asientos_disponibles').value;
            const costo = document.getElementById('costo').value;
            const estado = document.getElementById('estado').value;
            const idRuta = document.getElementById('id_ruta').value;
            const idUsuario = document.getElementById('id_usuario').value;
            
            if(!fecha || !asientos || !costo || !estado || !idRuta || !idUsuario) {
                document.getElementById('formularioViaje').reportValidity();
                return;
            }

            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema de manera segura.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultado_confirmacion) => {
                if (resultado_confirmacion.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El registro se ha completado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        document.getElementById('formularioViaje').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
