<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Declaración del juego de caracteres para soporte de acentos -->
    <meta charset="UTF-8">
    <!-- Configuración del diseño responsivo para diferentes dispositivos móviles y de escritorio -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título dinámico que cambia dependiendo si se está editando o creando un nuevo rol -->
    <title>{{ "Editar Rol" if rol else "Nuevo Rol" }} - Velox UTVT</title>
    
    <!-- Importación de librerías base: Bootstrap 5, Bootstrap Icons y SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Fondo blanco puro para mantener un diseño unificado institucional */
        body { background-color: #FFFFFF !important; }
        
        /* Ajuste del contenedor principal para dar espacio al menú lateral en escritorio */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        
        /* Clase principal para botones institucionales (Verde Velox) */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }
        .boton-verde:hover { background-color: #005200 !important; }
        
        /* Estilos específicos para los botones de confirmación de SweetAlert2 */
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover { background-color: #005200 !important; }
        
        /* --- MODO RESPONSIVO PARA DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            /* En pantallas móviles se elimina el margen porque el menú se superpone */
            #contenidoPrincipal {
                margin-left: 0 !important;
            }
            /* Apilamos los botones de guardar/cancelar para que ocupen todo el ancho y no se deformen */
            .grupo-botones {
                flex-direction: column;
                gap: 10px !important;
                width: 100%;
            }
            .grupo-botones a, .grupo-botones button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Inclusión dinámica del componente de menú lateral (Sidebar) -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor general centrado vertical y horizontalmente en la pantalla -->
    <div id="contenidoPrincipal" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        
        <!-- Restricción de ancho para que el formulario mantenga proporción en monitores grandes -->
        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <!-- Encabezado del Formulario -->
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-shield-lock-fill me-2"></i>{{ "Editar Rol #" ~ rol.id_rol if rol else "Registrar Nuevo Rol" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información solicitada en el formulario.</p>
                    </div>
                </div>

                <!-- Formulario Dinámico: Apunta al endpoint correspondiente según sea edición o alta -->
                <form id="formularioRol" action="{{ '/rol/actualizar' if rol else '/rol/guardar' }}" method="POST">
                    
                    <!-- Campo oculto para enviar el ID a la BD (solo en modo edición) -->
                    {% if rol %}
                    <input type="hidden" name="id_rol" value="{{ rol.id_rol }}">
                    <!-- Visualización de solo lectura del ID -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Rol</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ rol.id_rol }}" readonly>
                    </div>
                    {% endif %}

                    <!-- Campo de texto obligatorio para el nombre del Rol -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Nombre del Rol</label>
                        <input type="text" id="nombreRol" name="nombre_rol" class="form-control py-2" value="{{ rol.nombre_rol if rol else '' }}" placeholder="Ej. Administrador, Conductor, Pasajero" required>
                    </div>

                    <!-- Grupo de Botones Responsivo (Cancelar / Guardar) -->
                    <div class="grupo-botones d-flex justify-content-end gap-2">
                        <a href="/rol" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <!-- Botón que invoca la validación en JS antes de hacer Submit -->
                        <button type="button" onclick="confirmarGuardado()" class="btn boton-verde px-5 fw-bold shadow-sm rounded-pill">
                            {{ "Guardar Cambios" if rol else "Registrar Rol" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Oficial de Bootstrap para la interfaz visual -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        /**
         * Función para validar el campo de texto y desplegar las modales de confirmación con SweetAlert2.
         */
        function confirmarGuardado() {
            // Obtenemos y limpiamos espacios vacíos del campo de texto
            const valorNombreRol = document.getElementById('nombreRol').value.trim();
            
            // Validamos que el campo no esté vacío disparando la alerta nativa del navegador
            if(!valorNombreRol) {
                document.getElementById('formularioRol').reportValidity();
                return;
            }

            // Despliega la primera ventana modal de confirmación de acción
            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán tus datos en el sistema.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultadoConfirmacion) => {
                // Si el usuario presiona "Sí, guardar"
                if (resultadoConfirmacion.isConfirmed) {
                    
                    // Despliega la segunda modal indicando éxito temporal
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'Contenido registrado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        // Envía los datos del formulario al backend de FastAPI por POST
                        document.getElementById('formularioRol').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
