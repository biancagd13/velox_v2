<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica y metaetiquetas responsivas -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas y Análisis de Rutas - Velox UTVT</title>
    
    <!-- Librerías externas: Bootstrap 5 y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Fondo blanco puro para mantener diseño limpio */
        body { background-color: #FFFFFF !important; }
        
        /* Ajuste del contenedor principal para dar espacio al menú lateral en escritorio */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        
        /* Botón institucional primario (Verde Velox) */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }
        .boton-verde:hover { background-color: #005200 !important; }
        
        /* Botón secundario contorneado en verde */
        .boton-contorno-verde {
            color: #018701 !important;
            border-color: #018701 !important;
            transition: all 0.2s ease-in-out;
        }
        .boton-contorno-verde:hover {
            background-color: #018701 !important;
            color: #ffffff !important;
        }

        /* --- MODO RESPONSIVO PARA DISPOSITIVOS MÓVILES --- */
        @media (max-width: 768px) {
            /* Eliminamos el margen del menú en pantallas pequeñas */
            #contenidoPrincipal {
                margin-left: 0 !important;
                padding: 15px !important;
            }
            /* Apilamos el encabezado para que no se sobrepongan textos y botones */
            .encabezado-rutas {
                flex-direction: column;
                align-items: stretch !important;
                gap: 15px;
            }
            /* Botones a ancho completo para facilitar la interacción táctil */
            .grupo-botones-rutas {
                flex-direction: column;
                width: 100%;
            }
            .grupo-botones-rutas .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Inserción dinámica del menú lateral institucional -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor principal de la interfaz de estadísticas -->
    <div id="contenidoPrincipal" class="p-4 bg-white">
        
        <!-- Botón superior para desplegar el menú exclusivamente en móviles -->
        <div class="d-flex align-items-center mb-3">
            <button class="btn boton-verde p-1 px-2 me-3 shadow-sm rounded-3 d-block d-md-none" id="btnAbrirMenu" title="Mostrar Menú">
                <i class="bi bi-list fs-4"></i>
            </button>
        </div>

        <div class="container-fluid px-0">
            
            <!-- Encabezado responsivo: agrupado en PC, apilado en celular -->
            <div class="encabezado-rutas d-flex justify-content-between align-items-center mb-4">
                
                <!-- Títulos informativos del módulo -->
                <div>
                    <h2 class="fw-bold mb-1" style="color: #005200;">
                        <i class="bi bi-bar-chart-fill me-2"></i>Análisis de Rutas
                    </h2>
                    <p class="text-muted small mb-0">Rutas más demandadas en el sistema Velox UTVT.</p>
                </div>
                
                <!-- Grupo de botones interactivos para la gráfica -->
                <div class="grupo-botones-rutas d-flex gap-2">
                    <!-- Recargar vista y generar gráfica actualizada -->
                    <a href="/estadisticas" class="btn boton-verde shadow-sm rounded-3 fw-semibold">
                        <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
                    </a>
                    <!-- Opción nativa para descargar la gráfica generada por Matplotlib -->
                    <a href="{{ imagen_grafica }}" download="Grafica_Rutas_Velox_UTVT.png" class="btn btn-outline-success boton-contorno-verde shadow-sm rounded-3 fw-semibold" title="Guardar imagen localmente">
                        <i class="bi bi-download me-1"></i> Guardar Gráfica
                    </a>
                </div>
            </div>

            <!-- Contenedor blanco para la presentación visual de la gráfica -->
            <div class="card shadow-sm border rounded-4 bg-white text-center p-4">
                <div class="card-body">
                    
                    <!-- Marco decorativo que envuelve la gráfica -->
                    <div class="p-2 border rounded-4 bg-light shadow-sm d-inline-block" style="width: 100%; max-width: 800px;">
                        
                        <!-- Elemento imagen que carga la gráfica generada en el backend -->
                        <!-- Usamos object-fit: contain para evitar deformaciones en pantallas estrechas -->
                        <img src="{{ imagen_grafica }}?t=1" alt="Gráfica de Rutas Más Usadas" class="img-fluid rounded-3" 
                             style="max-height: 400px; width: 100%; object-fit: contain; cursor: zoom-in; transition: transform 0.3s ease;" 
                             id="imagenGraficaRutas">
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script principal de Bootstrap para manejo de componentes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Funcionalidad de interacción (Zoom in/out) sobre la imagen de la gráfica
        document.addEventListener("DOMContentLoaded", function() {
            const graficaRutas = document.getElementById("imagenGraficaRutas");
            
            // Validamos que la imagen haya cargado en la vista antes de aplicar el evento
            if (graficaRutas) {
                graficaRutas.addEventListener("click", function() {
                    const estaAmpliada = graficaRutas.style.maxHeight === "none";
                    
                    if (estaAmpliada) {
                        // Revertimos la imagen a su estado base
                        graficaRutas.style.maxHeight = "400px";
                        graficaRutas.style.transform = "scale(1)";
                        graficaRutas.style.cursor = "zoom-in";
                    } else {
                        // Expandimos la imagen e indicamos visualmente (zoom-out) la posibilidad de contraer
                        graficaRutas.style.maxHeight = "none";
                        graficaRutas.style.transform = "scale(1.05)";
                        graficaRutas.style.cursor = "zoom-out";
                    }
                });
            }
        });
    </script>
</body>
</html>
