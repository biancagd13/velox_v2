<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Calificaciones - Velox UTVT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #FFFFFF !important;
        }
        #mainContent {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        .btn-verde-custom {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
        }
        .btn-verde-custom:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }
        @media (max-width: 768px) {
            #mainContent {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Incluimos la barra lateral institucional -->
    {% include 'components/sidebar.html' %}

    <div id="mainContent" class="p-4 bg-white">
        <div class="container-fluid">
            <!-- Encabezado del Módulo -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1" style="color: #005200;">
                        <i class="bi bi-star-fill me-2"></i>Estadísticas y Desempeño de Calificaciones
                    </h2>
                    <p class="text-muted small mb-0">Análisis de calificaciones del servicio en Velox UTVT.</p>
                </div>
                
                <div class="d-flex gap-2">
                    <a href="/estadisticas-calificaciones" class="btn btn-verde-custom shadow-sm rounded-3 fw-semibold">
                        <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
                    </a>
                    <a href="{{ imagen_grafica }}" download="Calificaciones_Velox_UTVT.png" class="btn btn-outline-success shadow-sm rounded-3 fw-semibold">
                        <i class="bi bi-download me-1"></i> Guardar Gráfica
                    </a>
                </div>
            </div>

            <!-- Tarjeta Contenedora -->
            <div class="card shadow-sm border rounded-4 bg-white text-center p-4">
                <div class="card-body">
                    
                    <!-- Contenedor estilizado para mostrar la imagen generada dinámicamente -->
                    <div class="p-2 border rounded-4 bg-light shadow-sm d-inline-block">
                        <!-- Limitamos la altura y el ancho máximo para que no se vea exageradamente grande -->
                        <img src="{{ imagen_grafica }}?t=1" alt="Gráfica de Calificaciones" class="img-fluid rounded-3" style="max-height: 400px; max-width: 100%; width: auto; cursor: zoom-in;" id="imagenCalificaciones">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const img = document.getElementById("imagenCalificaciones");
            if (img) {
                img.addEventListener("click", function() {
                    if (img.style.maxHeight === "700px") {
                        img.style.maxHeight = "none";
                        img.style.transform = "scale(1.02)";
                        img.style.transition = "transform 0.3s ease";
                    } else {
                        img.style.maxHeight = "700px";
                        img.style.transform = "scale(1)";
                    }
                });
            }
        });
    </script>
</body>
</html>
