<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Velox UTVT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            background-color: #E8F5E9 !important;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }
        .boton-verde:hover { background-color: #005200 !important; color: #ffffff !important; }
        .login-card {
            max-width: 450px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="card border-0 bg-white p-5 login-card mx-auto">
            <div class="text-center mb-4">
                <div class="d-inline-block bg-success bg-opacity-10 p-3 rounded-circle mb-3">
                    <i class="bi bi-car-front-fill" style="font-size: 2.5rem; color: #018701;"></i>
                </div>
                <h3 class="fw-bold" style="color: #005200; letter-spacing: -0.5px;">Velox UTVT</h3>
                <p class="text-muted small">Ingresa con tu correo institucional para continuar</p>
            </div>

            <form id="formularioLogin" onsubmit="procesarLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Correo Institucional</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="correoInput" class="form-control border-start-0 py-2 bg-light" placeholder="al000@utvt.edu.mx" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small d-flex justify-content-between">
                        Contraseña
                        <a href="#" class="text-decoration-none text-success small">¿Olvidaste tu contraseña?</a>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" id="passwordInput" class="form-control border-start-0 py-2 bg-light" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn boton-verde w-100 fw-bold py-2 rounded-3 shadow-sm mb-3">
                    Iniciar Sesión
                </button>
                
                <div class="alert alert-secondary py-2 px-3 text-center border-0 rounded-3 mb-0 mt-3" role="alert" style="font-size: 0.75rem;">
                    <strong>Credenciales Demo:</strong><br>
                    Admin: <span class="font-monospace">al222@utvt.edu.mx</span><br>
                    Conductor: <span class="font-monospace">al22288@utvt.edu.mx</span><br>
                    Pasajero: <span class="font-monospace">pasajero@utvt.edu.mx</span>
                </div>
            </form>
        </div>
    </div>

    <script>
        function procesarLogin(event) {
            event.preventDefault();
            
            const correo = document.getElementById('correoInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value;

            if (password.length > 0) {
                Swal.fire({
                    title: 'Autenticando...',
                    text: 'Verificando credenciales en el sistema',
                    icon: 'info',
                    showConfirmButton: false,
                    timer: 1000
                }).then(() => {
                    if (correo === 'al22288@utvt.edu.mx' || correo.includes('conductor')) {
                        localStorage.setItem('velox_usuario_nombre', 'Brandon Rivera');
                        localStorage.setItem('velox_usuario_rol', 'Conductor');
                        localStorage.setItem('velox_usuario_inicial', 'B');
                        localStorage.setItem('velox_usuario_id', '1');
                        window.location.href = '/perfil-conductor';
                    } 
                    else if (correo === 'al222@utvt.edu.mx' || correo.includes('admin')) {
                        localStorage.setItem('velox_usuario_nombre', 'Brandon Rivera');
                        localStorage.setItem('velox_usuario_rol', 'Administrador');
                        localStorage.setItem('velox_usuario_inicial', 'B');
                        localStorage.setItem('velox_usuario_id', '1');
                        window.location.href = '/perfil';
                    } 
                    else {
                        localStorage.setItem('velox_usuario_nombre', 'Jorge Abraham');
                        localStorage.setItem('velox_usuario_rol', 'Pasajero');
                        localStorage.setItem('velox_usuario_inicial', 'J');
                        localStorage.setItem('velox_usuario_id', '2');
                        window.location.href = '/pasajero/';
                    }
                });
            }
        }
    </script>
</body>
</html>
