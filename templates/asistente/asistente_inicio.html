<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica y responsiva -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiSmart Asistente IA - Velox UTVT</title>
    
    <!-- Librerías de Bootstrap y utilidades -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Fondo principal de la vista */
        body { background-color: #FFFFFF !important; }
        
        /* Ajuste del contenedor principal para dejar espacio al menú lateral */
        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }
        
        /* Estilos del botón institucional verde */
        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
        }
        .boton-verde:hover { 
            background-color: #005200 !important; 
        }
        
        /* Contenedor con scroll para los mensajes */
        .caja-chat {
            height: 55vh;
            overflow-y: auto;
            background-color: #F8F9FA;
        }
        
        /* Base para las burbujas de texto */
        .burbuja {
            max-width: 75%;
            border-radius: 1rem;
            padding: 12px 16px;
            font-size: 0.95rem;
        }
        
        /* Burbuja verde para el usuario alineada a la derecha */
        .burbuja-usuario {
            background-color: #018701;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.2rem;
        }
        
        /* Burbuja gris para la IA alineada a la izquierda */
        .burbuja-ia {
            background-color: #E9ECEF;
            color: #212529;
            margin-right: auto;
            border-bottom-left-radius: 0.2rem;
        }
        
        /* Adaptación a dispositivos móviles (modo responsivo) */
        @media (max-width: 768px) {
            #contenidoPrincipal {
                margin-left: 0 !important;
                padding-top: 10px !important;
            }
            .caja-chat { height: 65vh; }
        }
        /* Fin de los estilos CSS */
    </style>
</head>
<body>
    <!-- Importación del menú lateral de Jinja2 -->
    {% include 'components/sidebar.html' %}

    <div id="contenidoPrincipal" class="p-4 bg-white">
        <!-- Botón para desplegar menú en pantallas móviles -->
        <div class="d-flex align-items-center mb-3">
            <button class="btn boton-verde p-1 px-2 me-3 shadow-sm rounded-3 d-block d-md-none" title="Mostrar Menú">
                <i class="bi bi-list fs-4"></i>
            </button>
        </div>

        <div class="container-fluid px-0">
            <!-- Título y descripción del módulo -->
            <div class="mb-4">
                <h2 class="fw-bold mb-1" style="color: #005200;">
                    <i class="bi bi-robot me-2"></i>LogiSmart - Asistente IA
                </h2>
                <p class="text-muted small mb-0">Consulta en tiempo real rutas y recomendaciones del sistema Velox.</p>
            </div>

            <!-- Interfaz principal del chat -->
            <div class="card shadow-sm border rounded-4 bg-white">
                
                <!-- Cabecera del chat con logo de la IA -->
                <div class="card-header bg-white border-bottom py-3 px-4 d-flex align-items-center">
                    <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold me-3 shadow-sm" style="width: 45px; height: 45px; background-color: #005200;">
                        <i class="bi bi-cpu-fill fs-5"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0" style="color: #005200;">LogiSmart IA</h6>
                        <small class="text-muted">Conectado con MongoDB y Ollama (Llama 3.2)</small>
                    </div>
                </div>

                <!-- Historial dinámico de la conversación -->
                <div id="historialChat" class="caja-chat p-4 d-flex flex-column gap-3">
                    <div class="burbuja burbuja-ia shadow-sm">
                        <b>LogiSmart:</b> ¡Hola! Soy tu asistente de logística de Velox UTVT. ¿En qué te ayudo hoy?
                    </div>
                </div>

                <!-- Controles para enviar preguntas -->
                <div class="card-footer bg-white border-top p-3">
                    <div class="input-group">
                        <input type="text" id="inputUsuario" class="form-control py-2 rounded-start-pill border" placeholder="Escribe tu consulta..." onkeypress="detectarEnter(event)">
                        <button class="btn boton-verde px-4 rounded-end-pill fw-bold shadow-sm" type="button" id="btnEnviar" onclick="enviarMensaje()">
                            <i class="bi bi-send-fill me-1 d-none d-sm-inline"></i> Enviar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Ejecuta el envío al presionar la tecla Enter
        function detectarEnter(evento) {
            if (evento.key === 'Enter') enviarMensaje();
        }

        // Petición asíncrona para consultar el modelo de IA en el backend
        async function enviarMensaje() {
            const inputUsuario = document.getElementById('inputUsuario');
            const historialChat = document.getElementById('historialChat');
            const btnEnviar = document.getElementById('btnEnviar');
            const texto = inputUsuario.value.trim();

            // Evita enviar peticiones vacías
            if (!texto) return;

            // Dibuja el mensaje del usuario en la pantalla
            historialChat.innerHTML += `<div class="burbuja burbuja-usuario shadow-sm"><b>Tú:</b> ${texto}</div>`;
            inputUsuario.value = '';
            historialChat.scrollTop = historialChat.scrollHeight;

            // Bloquea los controles mientras el servidor responde
            inputUsuario.disabled = true;
            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

            // Muestra mensaje temporal de carga
            const idCarga = 'carga-' + Date.now();
            historialChat.innerHTML += `<div id="${idCarga}" class="burbuja burbuja-ia shadow-sm text-muted fst-italic">Consultando base de datos...</div>`;
            historialChat.scrollTop = historialChat.scrollHeight;

            try {
                // Envia el texto ingresado a FastAPI usando POST
                const respuesta = await fetch('/asistente/consultar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: texto })
                });
                
                const datos = await respuesta.json();
                document.getElementById(idCarga).remove(); // Borra el aviso temporal

                // Evalúa el código de respuesta
                if (respuesta.ok) {
                    const textoIa = datos.respuesta.replace(/\n/g, '<br>');
                    historialChat.innerHTML += `<div class="burbuja burbuja-ia shadow-sm"><b>LogiSmart:</b> ${textoIa}</div>`;
                } else {
                    historialChat.innerHTML += `<div class="burbuja burbuja-ia shadow-sm text-danger"><b>Error:</b> ${datos.error}</div>`;
                }
            } catch (error) {
                // Notifica fallos graves (ej. Ollama apagado o sin conexión)
                document.getElementById(idCarga)?.remove();
                historialChat.innerHTML += `<div class="burbuja burbuja-ia shadow-sm text-danger"><b>Error de conexión con Ollama. Verifica la terminal.</b></div>`;
            } finally {
                // Restaura los botones y el foco
                inputUsuario.disabled = false;
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = '<i class="bi bi-send-fill me-1 d-none d-sm-inline"></i> Enviar';
                inputUsuario.focus();
                historialChat.scrollTop = historialChat.scrollHeight;
            }
        }
    </script>
</body>
</html>
