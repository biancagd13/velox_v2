<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Viajes - Velox UTVT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body, #mainContent, .card {
            background-color: #FFFFFF !important;
        }

        body {
            background-color: #FFFFFF !important;
        }

        #mainContent {
            margin-left: 280px;
            background-color: #FFFFFF;
            transition: margin-left 0.28s ease-in-out;
        }

        .titulo-velox {
            color: #005200;
        }

        .btn-verde-custom,
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-verde-custom:hover,
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }

        .btn-amarillo-cancelar {
            background-color: #f59e0b !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-amarillo-cancelar:hover {
            background-color: #d97706 !important;
            color: #ffffff !important;
        }

        .historial-card {
            border: 1px solid #e9ecef;
            border-radius: 16px;
            border-left: 4px solid #018701 !important;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .historial-card:hover {
            transform: translateY(-2px);
        }

        .metrica-box {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 14px 16px;
        }

        .chip-filtro.activa {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-color: #018701 !important;
        }

        @media (max-width: 768px) {
            #mainContent {
                margin-left: 0 !important;
                padding: 15px !important;
            }
        }
    </style>
</head>
<body class="bg-white">

    {% include 'components/sidebar.html' %}

    <div id="mainContent" class="p-4 bg-white">
        <div class="container-fluid px-0" style="max-width: 1140px;">

            <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
                <div>
                    <h3 class="fw-bold mb-1 titulo-velox">
                        <i class="bi bi-clock-history me-2"></i>Historial de Viajes
                    </h3>
                    <p class="text-muted small mb-0">Sigue tus solicitudes, lugares asignados, trayectos concluidos y cancelaciones.</p>
                </div>

                <a href="/pasajero/" class="btn btn-outline-secondary fw-semibold rounded-pill px-4 py-2">
                    <i class="bi bi-search me-1"></i>Buscar Viajes
                </a>
            </div>

            <!-- Indicadores rápidos -->
            <div class="row g-3 mb-4">
                <div class="col-sm-4">
                    <div class="metrica-box bg-light bg-white shadow-sm">
                        <label class="form-label small fw-semibold text-secondary d-block mb-1">Solicitudes realizadas</label>
                        <div id="kpiTotal" class="fw-bold fs-4 titulo-velox">0</div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="metrica-box bg-light bg-white shadow-sm">
                        <label class="form-label small fw-semibold text-secondary d-block mb-1">Activos o concluidos</label>
                        <div id="kpiActivos" class="fw-bold fs-4" style="color: #018701;">0</div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="metrica-box bg-light bg-white shadow-sm">
                        <label class="form-label small fw-semibold text-secondary d-block mb-1">Cancelados o rechazados</label>
                        <div id="kpiCancelados" class="fw-bold fs-4 text-secondary">0</div>
                    </div>
                </div>
            </div>

            <!-- Búsqueda y accesos directos de estado -->
            <div class="card shadow-sm rounded-4 p-3 p-md-4 bg-white mb-4">
                <form id="formFiltroHistorial" class="row g-3 align-items-end mb-3">
                    <div class="col-md-6">
                        <label for="filtroTexto" class="form-label small fw-semibold text-secondary mb-1">
                            Ruta o conductor
                        </label>
                        <input type="text" id="filtroTexto" class="form-control bg-light" placeholder="Ej. Toluca, Xona, Alexa...">
                    </div>
                    <div class="col-md-4">
                        <label for="filtroEstado" class="form-label small fw-semibold text-secondary mb-1">
                            Estatus
                        </label>
                        <select id="filtroEstado" class="form-select bg-light">
                            <option value="">Todos</option>
                            <option value="pendiente">En revisión</option>
                            <option value="aceptada">Lugar asignado</option>
                            <option value="finalizada">Concluido</option>
                            <option value="cancelada">Cancelado</option>
                            <option value="rechazada">Rechazado</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-verde-custom fw-semibold rounded-3 w-100 py-2">
                            <i class="bi bi-funnel-fill me-1"></i>Filtrar
                        </button>
                        <button type="button" id="btnLimpiarHistorial" class="btn btn-outline-secondary rounded-3 py-2" title="Restablecer">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </form>

            </div>

            <!-- Tarjetas del historial -->
            <div id="contenedorHistorial" class="row g-3">
                <div class="col-12">
                    <div class="card shadow-sm rounded-4 p-5 text-center bg-white">
                        <div class="spinner-border mx-auto mb-2" style="color: #018701;" role="status"></div>
                        <p class="text-muted small mb-0">Consultando tus movimientos...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let historialCompleto = [];

        function obtenerIdUsuarioActual() {
            const raw = (localStorage.getItem("velox_usuario_id") || "").trim();
            return /^\d+$/.test(raw) ? Number(raw) : null;
        }

        function describirEstado(estadoRes, estadoViaje) {
            const er = String(estadoRes || "").trim().toLowerCase();
            const ev = String(estadoViaje || "").trim().toLowerCase();

            if (["finalizada", "finalizado", "completada", "completado"].includes(er) || ["finalizado", "finalizada", "completado"].includes(ev)) {
                return { etiqueta: "Concluido", icono: "bi-flag-checkered", estilo: "", cancelable: false };
            }
            if (["cancelada", "cancelado"].includes(er)) {
                return { etiqueta: "Cancelado", icono: "bi-x-circle", estilo: "color: #d97706;", cancelable: false };
            }
            if (["rechazada", "rechazado"].includes(er)) {
                return { etiqueta: "Rechazado", icono: "bi-dash-circle", estilo: "", cancelable: false };
            }
            if (["aceptada", "confirmada"].includes(er)) {
                return { etiqueta: "Lugar asignado", icono: "bi-check-circle-fill", estilo: "color: #018701;", cancelable: true };
            }
            return { etiqueta: "En revisión", icono: "bi-hourglass-split", estilo: "color: #005200;", cancelable: true };
        }

        function sincronizarChips(estadoActivo) {
            document.querySelectorAll(".chip-filtro").forEach(btn => {
                const val = btn.getAttribute("data-estado") || "";
                btn.classList.toggle("activa", val === estadoActivo);
            });
        }

        function actualizarResumen(lista) {
            document.getElementById("kpiTotal").textContent = lista.length;
            const activos = lista.filter(i => {
                const e = String(i.estado_reserva || "").toLowerCase();
                return ["pendiente", "aceptada", "confirmada", "finalizada", "finalizado"].includes(e);
            }).length;
            const cancelados = lista.filter(i => {
                const e = String(i.estado_reserva || "").toLowerCase();
                return ["cancelada", "cancelado", "rechazada", "rechazado"].includes(e);
            }).length;

            document.getElementById("kpiActivos").textContent = activos;
            document.getElementById("kpiCancelados").textContent = cancelados;
        }

        function renderizarHistorial(lista) {
            const contenedor = document.getElementById("contenedorHistorial");

            if (!lista.length) {
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="card shadow-sm rounded-4 p-5 text-center bg-white">
                            <i class="bi bi-journal-x text-muted fs-1 mb-2"></i>
                            <h5 class="fw-bold titulo-velox">No hay trayectos con este criterio</h5>
                            <p class="text-muted small mb-3">Prueba otro filtro o solicita un lugar en las rutas activas.</p>
                            <div>
                                <a href="/pasajero/" class="btn btn-verde-custom rounded-pill px-4 fw-semibold">
                                    Buscar Viajes
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            contenedor.innerHTML = lista.map(item => {
                const info = describirEstado(item.estado_reserva, item.estado_viaje);
                const horario = [item.fecha, item.hora_salida && item.hora_salida !== "--:--" ? `${item.hora_salida} hrs` : ""].filter(Boolean).join(" · ") || "Horario pendiente";
                const detalleUrl = item.id_viaje ? `/pasajero/mi-viaje?id_viaje=${encodeURIComponent(item.id_viaje)}` : "/pasajero/mi-viaje";

                return `
                    <div class="col-12">
                        <div class="card historial-card shadow-sm bg-white p-3 p-md-4">
                            <div class="row g-3 align-items-center">
                                <div class="col-md-5">
                                    <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                                        <span class="badge bg-light text-secondary border px-2 py-1 rounded-pill small">
                                            Folio #${item.id_reserva ?? "-"}
                                        </span>
                                        <span class="badge bg-light border px-3 py-1 rounded-pill small fw-semibold" style="${info.estilo}">
                                            <i class="bi ${info.icono} me-1"></i>${info.etiqueta}
                                        </span>
                                    </div>
                                    <div class="fw-bold titulo-velox fs-6 mt-1">
                                        ${item.origen} <i class="bi bi-arrow-right mx-1 text-secondary"></i> ${item.destino}
                                    </div>
                                    <small class="text-muted">
                                        <i class="bi bi-calendar3 me-1"></i>${horario}
                                    </small>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary d-block mb-1">Conductor y cuota</label>
                                    <div class="small fw-bold text-secondary">
                                        <i class="bi bi-person-circle me-1 titulo-velox"></i>${item.conductor}
                                        <span class="ms-2 fw-normal text-muted"><i class="bi bi-star-fill" style="color: #f59e0b;"></i> ${item.calificacion}</span>
                                    </div>
                                    <div class="small fw-bold mt-1" style="color: #018701;">
                                        $${item.aportacion} <span class="text-muted fw-normal">MXN</span>
                                    </div>
                                </div>

                                <div class="col-md-3 d-flex flex-md-column justify-content-end gap-2">
                                    <a href="${detalleUrl}" class="btn btn-outline-secondary btn-sm rounded-pill fw-semibold px-3 py-2">
                                        <i class="bi bi-eye me-1"></i>Ver detalle
                                    </a>
                                    ${info.cancelable && item.id_reserva ? `
                                        <button type="button"
                                                class="btn btn-amarillo-cancelar btn-sm rounded-pill fw-semibold px-3 py-2"
                                                onclick="cancelarDesdeHistorial(${item.id_reserva})">
                                            <i class="bi bi-x-circle me-1"></i>Cancelar
                                        </button>
                                    ` : ""}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function filtrarHistorial() {
            const texto = (document.getElementById("filtroTexto").value || "").trim().toLowerCase();
            const estado = (document.getElementById("filtroEstado").value || "").trim().toLowerCase();
            sincronizarChips(estado);

            const filtrados = historialCompleto.filter(item => {
                const coincideTexto = !texto ||
                    String(item.origen || "").toLowerCase().includes(texto) ||
                    String(item.destino || "").toLowerCase().includes(texto) ||
                    String(item.conductor || "").toLowerCase().includes(texto);

                const er = String(item.estado_reserva || "").toLowerCase();
                const coincideEstado = !estado ||
                    (estado === "aceptada" ? ["aceptada", "confirmada"].includes(er) : er === estado);

                return coincideTexto && coincideEstado;
            });

            renderizarHistorial(filtrados);
        }

        async function cancelarDesdeHistorial(idReserva) {
            const confirmacion = await Swal.fire({
                title: "¿Liberar este lugar?",
                html: `<div class="text-small text-secondary">Se cancelará la solicitud <strong>#${idReserva}</strong>.</div>`,
                icon: "question",
                iconColor: "#7097a8",
                showCancelButton: true,
                confirmButtonText: "Sí, cancelar",
                cancelButtonText: "Volver",
                customClass: {
                    popup: "rounded-4",
                    confirmButton: "btn btn-amarillo-cancelar rounded-pill px-4 fw-semibold",
                    cancelButton: "btn btn-outline-secondary rounded-pill px-4 fw-semibold"
                },
                buttonsStyling: false
            });

            if (!confirmacion.isConfirmed) return;

            try {
                const resp = await fetch(`/reserva/api/cancelar/${idReserva}`, { method: "POST" });
                const data = await resp.json().catch(() => ({}));
                if (resp.ok && data.ok !== false) {
                    await cargarHistorial();
                    Swal.fire({
                        title: "Solicitud cancelada",
                        text: data.mensaje || "El lugar volvió a quedar disponible.",
                        icon: "success",
                        iconColor: "#018701",
                        customClass: {
                            popup: "rounded-4",
                            confirmButton: "btn btn-verde-modal rounded-pill px-4 fw-semibold"
                        },
                        buttonsStyling: false
                    });
                } else {
                    Swal.fire({
                        title: "No se pudo cancelar",
                        text: data.mensaje || "Revisa el estado de la solicitud.",
                        icon: "warning",
                        iconColor: "#7097a8",
                        customClass: {
                            popup: "rounded-4",
                            confirmButton: "btn btn-verde-modal rounded-pill px-4 fw-semibold"
                        },
                        buttonsStyling: false
                    });
                }
            } catch (_) {
                Swal.fire({
                    title: "Sin conexión",
                    text: "No fue posible conectar con el servidor.",
                    icon: "error",
                    iconColor: "#7097a8",
                    customClass: {
                        popup: "rounded-4",
                        confirmButton: "btn btn-verde-modal rounded-pill px-4 fw-semibold"
                    },
                    buttonsStyling: false
                });
            }
        }

        async function cargarHistorial() {
            const idUsuario = obtenerIdUsuarioActual();
            const query = idUsuario ? `?id_usuario=${encodeURIComponent(idUsuario)}` : "";

            try {
                const resp = await fetch(`/reserva/api/historial${query}`);
                if (resp.ok) {
                    const data = await resp.json();
                    historialCompleto = Array.isArray(data.historial) ? data.historial : [];
                } else {
                    historialCompleto = [];
                }
            } catch (_) {
                historialCompleto = [];
            }

            actualizarResumen(historialCompleto);
            filtrarHistorial();
        }

        document.addEventListener("DOMContentLoaded", () => {
            cargarHistorial();

            document.getElementById("formFiltroHistorial").addEventListener("submit", (e) => {
                e.preventDefault();
                filtrarHistorial();
            });

            document.querySelectorAll(".chip-filtro").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.getElementById("filtroEstado").value = btn.getAttribute("data-estado") || "";
                    filtrarHistorial();
                });
            });

            document.getElementById("btnLimpiarHistorial").addEventListener("click", () => {
                document.getElementById("filtroTexto").value = "";
                document.getElementById("filtroEstado").value = "";
                filtrarHistorial();
            });
        });
    </script>
</body>
</html>
