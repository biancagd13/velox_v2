<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Declaración del juego de caracteres UTF-8 para garantizar el soporte de acentos y eñes -->
    <meta charset="UTF-8">

    <!-- Configuración del diseño responsivo para asegurar adaptabilidad en dispositivos móviles y escritorios -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título dinámico de la pestaña del navegador: cambia entre 'Editar' o 'Registrar' según el contexto -->
    <title>{{ "Editar Vehículo" if vehiculo else "Nuevo Vehículo" }} - Velox UTVT</title>

    <!-- Importación de la hoja de estilos oficial de Bootstrap 5 para el diseño de componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importación de Bootstrap Icons para los iconos institucionales del sistema -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Importación de la librería SweetAlert2 para la gestión de alertas y modales interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Definición estricta del color de fondo general de la página en blanco puro */
        body {
            background-color: #FFFFFF !important;
        }

        /* Margen izquierdo para evitar que el formulario se encime con el menú lateral fijo */
        #mainContent {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }

        /* Clase personalizada para botones verdes primarios institucionales (#018701) */
        .btn-verde-custom {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }

        /* Efecto hover hacia el verde institucional fuerte (#005200) */
        .btn-verde-custom:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }

        /* Estilo personalizado y unificado para los botones de confirmación positivos en las modales */
        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }

        /* Efecto hover del botón de la modal hacia el verde institucional fuerte (#005200) */
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
        }

        /* Regla responsiva para dispositivos móviles: elimina el margen izquierdo cuando el menú se oculta */
        @media (max-width: 768px) {
            #mainContent {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Inclusión modular del componente de navegación lateral flotante institucional -->
    {% include 'components/sidebar.html' %}

    <!-- Contenedor principal del formulario con alineación centrada y diseño fluido -->
    <div id="mainContent" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        <div class="container px-3" style="max-width: 600px;">
            
            <!-- Tarjeta contenedora con bordes redondeados (rounded-4) y sombra suave -->
            <div class="card shadow-sm border rounded-4 p-5 bg-white">
                
                <!-- Encabezado superior de la tarjeta con icono institucional y títulos dinámicos -->
                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-car-front-fill me-2" style="color: #005200;"></i>{{ "Editar Vehículo #" ~ vehiculo.id_vehiculo if vehiculo else "Registrar Nuevo Vehículo" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información del automóvil en el sistema institucional.</p>
                    </div>
                </div>

                <!-- Formulario HTML principal: apunta de manera dinámica a la ruta de actualizar o guardar según el estado -->
                <form id="formularioVehiculo" action="{{ '/vehiculo/actualizar' if vehiculo else '/vehiculo/guardar' }}" method="POST">
                    
                    <!-- Campo oculto para enviar el ID del registro en caso de actualización -->
                    {% if vehiculo %}
                    <input type="hidden" name="id_vehiculo" value="{{ vehiculo.id_vehiculo }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ vehiculo.id_vehiculo }}" readonly>
                    </div>
                    {% endif %}

                    <!-- Campo de texto para la Placa -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Placa</label>
                        <input type="text" id="placa" name="placa" class="form-control py-2" value="{{ vehiculo.placa if vehiculo else '' }}" placeholder="Ej. ABC-123-A" required>
                    </div>

                    <!-- Campo de texto para el Nombre / Marca del Auto -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Nombre / Marca</label>
                        <input type="text" id="nombre" name="nombre" class="form-control py-2" value="{{ vehiculo.nombre if vehiculo else '' }}" placeholder="Ej. Chevrolet Aveo" required>
                    </div>

                    <!-- Campo de texto para el Modelo -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Modelo (Año)</label>
                        <input type="text" id="modelo" name="modelo" class="form-control py-2" value="{{ vehiculo.modelo if vehiculo else '' }}" placeholder="Ej. 2023" required>
                    </div>

                    <!-- Campo de texto para el Color -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Color</label>
                        <input type="text" id="color" name="color" class="form-control py-2" value="{{ vehiculo.color if vehiculo else '' }}" placeholder="Ej. Blanco Platino" required>
                    </div>

                    <!-- Campo numérico para la Capacidad de Asientos -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Capacidad de Asientos</label>
                        <input type="number" id="capacidad_asientos" name="capacidad_asientos" min="1" max="10" class="form-control py-2" value="{{ vehiculo.capacidad_asientos if vehiculo else '' }}" placeholder="Ej. 4" required>
                    </div>

                    <!-- Selector dinámico para elegir el Propietario (Usuario) -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Propietario (Conductor)</label>
                        <select id="id_usuario" name="id_usuario" class="form-select py-2" required>
                            <option value="" disabled selected>Selecciona un usuario...</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id_usuario }}" {% if vehiculo and vehiculo.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Botones de navegación y envío del formulario alineados a la derecha -->
                    <div class="d-flex justify-content-end gap-2">
                        <!-- Botón de cancelación -->
                        <a href="/vehiculo" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        
                        <!-- Botón de envío que dispara la validación interactiva por JavaScript -->
                        <button type="button" onclick="confirmarGuardado()" class="btn px-5 fw-bold shadow-sm rounded-pill btn-verde-custom">
                            {{ "Guardar Cambios" if vehiculo else "Registrar Vehículo" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Importación del bundle de scripts de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /**
         * Función JavaScript encargada de validar los campos obligatorios del formulario 
         * y desplegar un flujo interactivo de ventanas modales mediante SweetAlert2.
         */
        function confirmarGuardado() {
            const placa = document.getElementById('placa').value;
            const nombre = document.getElementById('nombre').value;
            const modelo = document.getElementById('modelo').value;
            const color = document.getElementById('color').value;
            const capacidad = document.getElementById('capacidad_asientos').value;
            const idUsuario = document.getElementById('id_usuario').value;
            
            if(!placa.trim() || !nombre.trim() || !modelo.trim() || !color.trim() || !capacidad || !idUsuario) {
                document.getElementById('formularioVehiculo').reportValidity();
                return;
            }

            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán los datos del vehículo en el sistema.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultado_confirmacion) => {
                if (resultado_confirmacion.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El vehículo se ha registrado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        document.getElementById('formularioVehiculo').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
