<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar Vehículo" if vehiculo else "Nuevo Vehículo" }} - Velox UTVT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #FFFFFF !important;
        }

        #contenidoPrincipal {
            margin-left: 280px;
            transition: margin-left 0.3s ease-in-out;
        }

        .boton-verde {
            background-color: #018701 !important;
            color: #ffffff !important;
            border: none;
            transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
        }
        .boton-verde:hover {
            background-color: #005200 !important;
            color: #ffffff !important;
        }

        .swal2-confirm.btn-verde-modal {
            background-color: #018701 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            padding: 8px 24px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }
        .swal2-confirm.btn-verde-modal:hover {
            background-color: #005200 !important;
        }

        @media (max-width: 768px) {
            #contenidoPrincipal {
                margin-left: 0 !important;
            }
            .grupo-botones {
                flex-direction: column;
                gap: 10px !important;
                width: 100%;
            }
            .grupo-botones a, .grupo-botones button {
                width: 100%;
            }
        }
    </style>
</head>
<body class="bg-white">

    {% include 'components/sidebar.html' %}

    <div id="contenidoPrincipal" class="p-4 d-flex flex-column align-items-center justify-content-center bg-white" style="min-height: 100vh;">

        <div class="container px-3" style="max-width: 600px;">
            <div class="card shadow-sm border rounded-4 p-5 bg-white">

                <div class="d-flex align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #005200;">
                            <i class="bi bi-car-front-fill me-2"></i>{{ "Editar Vehículo #" ~ vehiculo.id_vehiculo if vehiculo else "Registrar Nuevo Vehículo" }}
                        </h3>
                        <p class="text-muted small mb-0">Completa la información del automóvil en el sistema institucional.</p>
                    </div>
                </div>

                <form id="formularioVehiculo" action="{{ '/vehiculo/actualizar' if vehiculo else '/vehiculo/guardar' }}" method="POST">

                    {% if vehiculo %}
                    <input type="hidden" name="id_vehiculo" value="{{ vehiculo.id_vehiculo }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">ID del Registro</label>
                        <input type="text" class="form-control bg-light fw-bold text-muted" value="#{{ vehiculo.id_vehiculo }}" readonly>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Placa</label>
                        <input type="text" id="placaVehiculo" name="placa" class="form-control py-2" value="{{ vehiculo.placa if vehiculo else '' }}" placeholder="Ej. ABC-123-A" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Nombre / Marca</label>
                        <input type="text" id="nombreVehiculo" name="nombre" class="form-control py-2" value="{{ vehiculo.nombre if vehiculo else '' }}" placeholder="Ej. Chevrolet Aveo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Modelo (Año)</label>
                        <input type="text" id="modeloVehiculo" name="modelo" class="form-control py-2" value="{{ vehiculo.modelo if vehiculo else '' }}" placeholder="Ej. 2023" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Color</label>
                        <input type="text" id="colorVehiculo" name="color" class="form-control py-2" value="{{ vehiculo.color if vehiculo else '' }}" placeholder="Ej. Blanco Platino" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Capacidad de Asientos</label>
                        <input type="number" id="capacidadVehiculo" name="capacidad_asientos" min="1" max="10" class="form-control py-2" value="{{ vehiculo.capacidad_asientos if vehiculo else '' }}" placeholder="Ej. 4" required>
                    </div>

                    <!-- BLOQUE PROPIETARIO: Automático para Conductor, Lista desplegable solo para Administrador -->
                    <div class="mb-4" id="contenedorPropietario">
                        <label class="form-label fw-semibold text-secondary small">Propietario (Conductor)</label>

                        <!-- Campo oculto siempre presente para enviar id_usuario en el POST -->
                        <input type="hidden" id="idUsuarioHidden" name="id_usuario" value="{{ vehiculo.id_usuario if vehiculo and vehiculo.id_usuario else '' }}">

                        <!-- Vista para Conductor: muestra su nombre detectado sin desplegar lista de usuarios -->
                        <div id="bloqueConductorPropietario" class="d-none">
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-person-check-fill" style="color: #018701;"></i></span>
                                <input type="text" id="nombreConductorDetectado" class="form-control bg-light fw-semibold text-dark py-2" value="Detectando conductor..." readonly>
                            </div>
                        </div>

                        <!-- Vista para Administrador: muestra la lista completa de usuarios -->
                        <div id="bloqueAdminPropietario" class="d-none">
                            <select id="idUsuario" class="form-select py-2">
                                <option value="" disabled {% if not (vehiculo and vehiculo.id_usuario) %}selected{% endif %}>Selecciona un usuario...</option>
                                {% for usuario in usuarios %}
                                <option value="{{ usuario.id_usuario }}" {% if vehiculo and vehiculo.id_usuario == usuario.id_usuario %}selected{% endif %}>
                                    {{ usuario.nombre }} {{ usuario.apellido_paterno }} ({{ usuario.correo_institucional }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="grupo-botones d-flex justify-content-end gap-2">
                        <a href="/vehiculo" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancelar</a>
                        <button type="button" onclick="confirmarGuardado()" class="btn boton-verde px-5 fw-bold shadow-sm rounded-pill">
                            {{ "Guardar Cambios" if vehiculo else "Registrar Vehículo" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function configurarPropietarioPorRol() {
            const rolRaw = (localStorage.getItem('velox_usuario_rol') || '').trim().toLowerCase();
            const esAdmin = rolRaw === 'administrador' || rolRaw === 'admin';

            const bloqueConductor = document.getElementById('bloqueConductorPropietario');
            const bloqueAdmin = document.getElementById('bloqueAdminPropietario');
            const selectAdmin = document.getElementById('idUsuario');
            const inputHidden = document.getElementById('idUsuarioHidden');
            const inputNombreConductor = document.getElementById('nombreConductorDetectado');

            if (esAdmin) {
                if (bloqueAdmin) bloqueAdmin.classList.remove('d-none');
                if (bloqueConductor) bloqueConductor.classList.add('d-none');
                if (selectAdmin) {
                    selectAdmin.setAttribute('required', 'required');
                    if (inputHidden && inputHidden.value) {
                        selectAdmin.value = inputHidden.value;
                    }
                    selectAdmin.addEventListener('change', function () {
                        if (inputHidden) inputHidden.value = this.value;
                    });
                }
                return;
            }

            // Modo Conductor: siempre prioriza al conductor en sesión
            if (bloqueConductor) bloqueConductor.classList.remove('d-none');
            if (bloqueAdmin) bloqueAdmin.classList.add('d-none');
            if (selectAdmin) selectAdmin.removeAttribute('required');

            const idStorage = (localStorage.getItem('velox_usuario_id') || '').trim();
            const nombreStorage = (localStorage.getItem('velox_usuario_nombre') || '').trim();

            if (idStorage && inputHidden) {
                inputHidden.value = idStorage;
            }

            let etiquetaFinal = nombreStorage;
            if (selectAdmin && idStorage) {
                const opcionSesion = Array.from(selectAdmin.options).find(
                    (opt) => String(opt.value).trim() === idStorage
                );
                if (opcionSesion && opcionSesion.textContent.trim()) {
                    etiquetaFinal = opcionSesion.textContent.trim();
                }
            }

            if (inputNombreConductor) {
                inputNombreConductor.value = etiquetaFinal || (idStorage ? `Conductor #${idStorage}` : 'Conductor en sesión');
            }
        })();

        function confirmarGuardado() {
            const rolRaw = (localStorage.getItem('velox_usuario_rol') || '').trim().toLowerCase();
            const esAdmin = rolRaw === 'administrador' || rolRaw === 'admin';

            const inputHidden = document.getElementById('idUsuarioHidden');
            const selectAdmin = document.getElementById('idUsuario');

            if (esAdmin && selectAdmin && inputHidden) {
                inputHidden.value = selectAdmin.value;
            }

            const placa = document.getElementById('placaVehiculo').value.trim();
            const nombre = document.getElementById('nombreVehiculo').value.trim();
            const modelo = document.getElementById('modeloVehiculo').value.trim();
            const color = document.getElementById('colorVehiculo').value.trim();
            const capacidad = document.getElementById('capacidadVehiculo').value;
            const usuario = (inputHidden ? inputHidden.value : '').trim();

            if (!placa || !nombre || !modelo || !color || !capacidad || !usuario) {
                if (esAdmin && selectAdmin && !selectAdmin.value) {
                    selectAdmin.setCustomValidity('Selecciona un usuario');
                }
                document.getElementById('formularioVehiculo').reportValidity();
                if (selectAdmin) selectAdmin.setCustomValidity('');
                return;
            }

            Swal.fire({
                title: '¿Guardar cambios?',
                text: 'Se registrarán los datos del vehículo en el sistema.',
                icon: 'question',
                iconColor: '#7097a8',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-4 p-4',
                    confirmButton: 'btn-verde-modal',
                    cancelButton: 'rounded-3 px-4 fw-bold'
                }
            }).then((resultadoConfirmacion) => {
                if (resultadoConfirmacion.isConfirmed) {
                    Swal.fire({
                        title: '¡Operación Exitosa!',
                        text: 'El vehículo se ha registrado correctamente.',
                        icon: 'success',
                        iconColor: '#018701',
                        confirmButtonText: 'Aceptar',
                        customClass: {
                            popup: 'rounded-4 p-4',
                            confirmButton: 'btn-verde-modal'
                        }
                    }).then(() => {
                        document.getElementById('formularioVehiculo').submit();
                    });
                }
            });
        }
    </script>
</body>
</html>
